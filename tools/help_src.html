<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HazardFill - Help · utilizzo</title>
<style>
 body{font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#222}
 h1{font-size:24px} h2{font-size:18px;margin-top:30px;border-bottom:1px solid #ddd;padding-bottom:4px} h3{font-size:15px;margin-top:20px}
 code{background:#f2f2f2;padding:1px 4px;border-radius:3px} table{border-collapse:collapse;margin:8px 0}
 td,th{border:1px solid #ccc;padding:4px 9px;text-align:left;vertical-align:top} th{background:#f5f5f5}
 .sw{display:inline-block;width:14px;height:14px;border:1px solid #888;vertical-align:-2px;margin-right:6px}
 .note{background:#fff8e1;border-left:4px solid #f5b400;padding:6px 12px;margin:10px 0}
 .exrow{display:flex;flex-wrap:wrap;gap:18px;margin:10px 0 4px}
 figure.ex{margin:0}
 figcaption{font-size:12px;color:#444;max-width:200px;margin-top:3px}
 table.g{border-collapse:collapse;margin:0} table.g td{width:16px;height:16px;padding:0;border:1px solid #bbb;text-align:center;font-size:8px;color:#222}
 .ex-title{font-size:13px;color:#555;margin:14px 0 0}
 ol.steps li{margin:3px 0}
 .warn{background:#fff8e1;border-left:4px solid #f5b400;padding:8px 14px;margin:12px 0;font-size:14px}
 .hd{display:flex;align-items:center;gap:16px;margin-bottom:8px} .hd h1{margin:0} .sub{color:#555;font-size:14px}
 .L{display:none} html[lang=en] #L-en,html[lang=it] #L-it{display:block}
 #langbar{position:fixed;top:10px;right:14px;z-index:9}
 #langbar button{font:600 13px system-ui,Arial;border:1px solid #888;background:#fff;border-radius:16px;padding:4px 12px 4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
 #langbar button:hover{background:#eef6ff}
 #langbar svg{width:22px;height:15px;border:1px solid #999}
</style></head><body>
{{LANGBAR}}
<div class="L" id="L-en">
{{BODY_EN}}
</div>
<div class="L" id="L-it">
{{BODY_IT}}
</div>
{{LANGJS}}
</body></html>
